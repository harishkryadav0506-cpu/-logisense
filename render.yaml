services:
  - type: web
    name: logisense-backend
    runtime: python
    buildCommand: pip install -r requirements.txt && python -m rag.ingest
    startCommand: python startup.py && uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.9
      - key: ENVIRONMENT
        value: production
